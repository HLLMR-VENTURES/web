# Security headers for dhellmer.com, included at server level and again in any location that adds its
# own headers (an add_header inside a location replaces the server-level set).
#
# CSP is split in two on purpose. Each page carries a <meta http-equiv="content-security-policy">
# generated by Astro with the exact hashes of its scripts and styles plus default/connect/img/font/
# object/base-uri/form-action. Browsers enforce every policy present, so this header adds only what
# a <meta> policy cannot express and must not restrict script-src or style-src itself.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
# HSTS is deliberately NOT sent: as on hllmr.com, turning it on is an owner
# decision (send it from here OR from the NPM proxy host toggle, never both; never includeSubDomains
# from one site's config).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
