# Security headers for silo.hllmr.com, included at server level and again in any location that
# adds its own headers (an add_header inside a location replaces the server-level set).
#
# CSP is split in two on purpose. Each page carries a <meta http-equiv="content-security-policy">
# generated by Astro with the exact hashes of its scripts and styles plus default/connect/img/font/
# media/object/base-uri/form-action. Browsers enforce every policy present, so this header adds
# only what a <meta> policy cannot express and must not restrict script-src or style-src itself.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
# HSTS: off until the owner decides (as for hllmr.com). If turned on: without includeSubDomains
# (other hllmr.com names are not all HTTPS-only), from here OR the NPM host-12 toggle, never both.
# add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
