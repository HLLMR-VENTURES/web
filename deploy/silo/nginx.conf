# silo.hllmr.com site server. Vendored unchanged into hllmr-infra deploy/apps/silo-site/ (infra owns
# the deployed copy, container silo-site-web). Derived from the hllmr-new-website static-site
# template. CI runs the URL contract against this exact file in nginxinc/nginx-unprivileged
# (tests/url-contract/run-nginx.sh). Validate with `nginx -t`.
#
# Mounts expected (compose): ./www -> /srv/www:ro ; ./metrics -> /srv/www/runtime:ro (the host
# counts job's metrics.json) ; this file -> /etc/nginx/conf.d/default.conf ;
# security-headers.conf and redirects.conf -> /etc/nginx/silo/.
# TLS, HTTP->HTTPS and certificates stay in Nginx Proxy Manager (proxy host 12).

# Cache policy by path: hashed build assets are immutable; everything else revalidates.
map $uri $silo_cache_control {
    default                                  "no-cache";
    ~^/_astro/                               "public, max-age=31536000, immutable";
    ~^/media/                                "public, max-age=31536000, immutable";
    ~^/screenshots/                          "public, max-age=86400";
    ~^/(og\.png|favicon\.ico|favicon-32\.png|apple-touch-icon\.png)$  "public, max-age=86400";
    /schema/silo.v1.json                     "public, max-age=3600";
    /metrics.json                            "no-store";
}

server {
    listen 8080;
    server_name silo.hllmr.com;

    # Resolved per request, so an atomic switch of www/current -> releases/<sha> is live at once.
    root /srv/www/current;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    # Redirect targets stay relative (/trust/), never http://silo-site-web:8080/trust/.
    absolute_redirect off;

    # Health only: proves nginx is serving, says nothing about content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A static site needs only reads.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/silo/security-headers.conf;
    add_header Cache-Control $silo_cache_control always;

    # Redirect layer (/go/<key>, /discord, retired paths), generated from sites/silo/redirects.json.
    include /etc/nginx/silo/redirects.conf;

    # Runtime file written by the host's metrics job; lives outside releases so a release never
    # clobbers it. (Inherits the server-level headers: no add_header in this block.)
    location = /metrics.json {
        alias /srv/www/runtime/metrics.json;
        default_type application/json;
    }

    # silo.json JSON Schema: fetched by editors and validators from any origin.
    location = /schema/silo.v1.json {
        default_type application/schema+json;
        include /etc/nginx/silo/security-headers.conf;
        add_header Cache-Control $silo_cache_control always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Public author profiles: /authors/<login>/ is a client-rendered shell until prerendering.
    # profile.shell.html contains a dot, which no GitHub login can, so it never shadows an author.
    location ^~ /authors/ {
        try_files $uri $uri/ /authors/profile.shell.html;
    }

    # Everything else, including /c/?g=… and /c/?r=… (query strings pass through untouched) and
    # the legacy /legal/*.html file URLs.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
    }

    # Not `internal`: the release tool fetches every manifest file, including 404.html.
    error_page 404 /404.html;
}
