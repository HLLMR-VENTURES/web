# tools.hllmr.com site server (HLLMR TOOLS, ADR-0015): PROPOSED by HLLMR/web for infra to review
# and vendor into hllmr-infra deploy/apps/tools-hllmr-com/ (infra owns the deployed copy). Same
# shape as deploy/hllmr/nginx.conf. CI runs the URL contract against this exact file in
# nginxinc/nginx-unprivileged (tests/url-contract/run-nginx-family.sh tools).
#
# Mounts expected (compose): ./www -> /srv/www:ro ; this file -> /etc/nginx/conf.d/default.conf ;
# security-headers.conf -> /etc/nginx/tools/security-headers.conf.
# TLS, HTTP->HTTPS and certificates stay in Nginx Proxy Manager.

map $uri $tools_cache_control {
    default                                  "no-cache";
    ~^/_astro/                               "public, max-age=31536000, immutable";
    ~/og\.(png|svg)$                         "public, max-age=86400";
    ~^/favicon\.svg$                         "public, max-age=86400";
}

server {
    listen 8080;
    server_name tools.hllmr.com;

    # Resolved per request, so an atomic switch of www/current -> releases/<id> is live at once.
    root /srv/www/current;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    # Directory redirects stay relative, never http://<container>:8080/...
    absolute_redirect off;

    # Health only: proves nginx is serving, says nothing about content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A static site needs only reads.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/tools/security-headers.conf;
    add_header Cache-Control $tools_cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    # Not `internal`: the release tool fetches every manifest file, including 404.html.
    error_page 404 /404.html;
}
