# Security headers for gaming.hllmr.com, included at server level and again in any location that adds its own
# headers. Same policy as deploy/hllmr/security-headers.conf: the per-page <meta> CSP carries the
# script/style hashes; this header adds only what a <meta> policy cannot express.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
# HSTS is per host and an owner decision (ADR-0015 D8): never includeSubDomains.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
