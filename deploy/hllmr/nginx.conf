# hllmr.com site server: PROPOSED by HLLMR/web for infra to review and vendor into hllmr-infra
# deploy/apps/hllmr-com/ (infra owns the deployed copy). Same shape as deploy/silo/nginx.conf.
# CI runs the URL contract against this exact file in nginxinc/nginx-unprivileged
# (tests/url-contract/run-nginx-hllmr.sh). Validate with `nginx -t`.
#
# Mounts expected (compose): ./www -> /srv/www:ro ; this file -> /etc/nginx/conf.d/default.conf ;
# security-headers.conf -> /etc/nginx/hllmr/security-headers.conf.
# TLS, HTTP->HTTPS, www -> apex and certificates stay in Nginx Proxy Manager (proxy host 14,
# redirection host 1).

# Cache policy by path: hashed build assets are immutable; everything else revalidates.
map $uri $hllmr_cache_control {
    default                                  "no-cache";
    ~^/_astro/                               "public, max-age=31536000, immutable";
    ~/og\.(png|svg)$                         "public, max-age=86400";
    ~^/(favicon\.png|favicon\.svg)$          "public, max-age=86400";
    ~^/assets/                               "public, max-age=86400";
}

server {
    listen 8080;
    server_name hllmr.com;

    # Resolved per request, so an atomic switch of www/current -> releases/<id> is live at once.
    root /srv/www/current;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
    # Directory redirects stay relative (/projects/), never http://hllmr-com-web:8080/projects/.
    absolute_redirect off;

    # Health only: proves nginx is serving, says nothing about content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A static site needs only reads.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/hllmr/security-headers.conf;
    add_header Cache-Control $hllmr_cache_control always;

    # DR-002 (2026-08): the methodology page moved from /plumbline/ to /writwall/. Exact match only,
    # so /plumbline/og.png keeps resolving for Open Graph cards already scraped. Absolute target, as
    # on the 2026-08 site. Mirrored in sites/hllmr/redirects.json (the contract test checks both).
    location = /plumbline { return 301 https://hllmr.com/writwall/; }
    location = /plumbline/ { return 301 https://hllmr.com/writwall/; }

    location = /feed.xml {
        default_type application/rss+xml;
        include /etc/nginx/hllmr/security-headers.conf;
        add_header Cache-Control $hllmr_cache_control always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    # Not `internal`: the release tool fetches every manifest file, including 404.html.
    error_page 404 /404.html;
}
