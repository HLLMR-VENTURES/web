# External link sweep, off the PR path so a flaky third party never blocks a merge. A failure
# shows up as a failed scheduled run in the Actions tab; nothing is posted anywhere.
name: links-weekly

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429
            --root-dir ${{ github.workspace }}/sites/silo/dist
            --exclude "^https://silo\.hllmr\.com/"
            "sites/silo/dist/**/*.html"
          fail: true
